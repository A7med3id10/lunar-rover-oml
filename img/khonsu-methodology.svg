<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title description">
  <title id="title">Khonsu MBSE methodology</title>
  <desc id="description">Mission needs and lunar context inform requirements. Requirements guide rover design, which is assessed through resource and risk analysis, then verified. Evidence and findings feed back to refine requirements and design.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52677a"/>
    </marker>
    <marker id="arrow-feedback" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#9b5b28"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #183247; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #52677a; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; fill: #40596c; }
      .box { stroke-width: 2; rx: 12; }
      .flow { fill: none; stroke: #52677a; stroke-width: 2.5; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #9b5b28; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-feedback); }
    </style>
  </defs>

  <rect width="1000" height="800" fill="#f7f9fb"/>
  <text x="500" y="46" text-anchor="middle" class="title">Khonsu MBSE Methodology</text>
  <text x="500" y="74" text-anchor="middle" class="subtitle">From mission intent to verified, traceable design</text>

  <g class="flow">
    <path d="M300 180 L410 220"/>
    <path d="M700 180 L590 220"/>
    <path d="M500 295 L500 330"/>
    <path d="M500 410 L500 445"/>
    <path d="M500 525 L500 560"/>
    <path d="M500 640 L500 675"/>
  </g>
  <path class="feedback" d="M700 710 L920 710 L920 258 L750 258"/>

  <g>
    <rect class="box" x="100" y="105" width="300" height="75" fill="#e8f1fb" stroke="#5281ad"/>
    <text x="250" y="137" text-anchor="middle" class="heading">Mission needs</text>
    <text x="250" y="161" text-anchor="middle" class="body">Objectives · stakeholders</text>

    <rect class="box" x="600" y="105" width="300" height="75" fill="#e8f1fb" stroke="#5281ad"/>
    <text x="750" y="137" text-anchor="middle" class="heading">Lunar context</text>
    <text x="750" y="161" text-anchor="middle" class="body">Environment · terrain · hazards</text>

    <rect class="box" x="250" y="220" width="500" height="75" fill="#fff3dc" stroke="#c18a32"/>
    <text x="500" y="252" text-anchor="middle" class="heading">Requirements</text>
    <text x="500" y="276" text-anchor="middle" class="body">Define needs and maintain traceability</text>

    <rect class="box" x="250" y="330" width="500" height="80" fill="#e9e9fa" stroke="#7776b5"/>
    <text x="500" y="363" text-anchor="middle" class="heading">Rover design</text>
    <text x="500" y="389" text-anchor="middle" class="body">Capabilities · subsystems · components</text>

    <rect class="box" x="250" y="445" width="500" height="80" fill="#e9f2e7" stroke="#6d9a62"/>
    <text x="500" y="478" text-anchor="middle" class="heading">Engineering analysis</text>
    <text x="500" y="504" text-anchor="middle" class="body">Resource budgets · scenarios · risk</text>

    <rect class="box" x="250" y="560" width="500" height="80" fill="#f2eafa" stroke="#9471ab"/>
    <text x="500" y="593" text-anchor="middle" class="heading">Verification</text>
    <text x="500" y="619" text-anchor="middle" class="body">Tests · analysis · inspection</text>

    <rect class="box" x="250" y="675" width="450" height="70" fill="#fcebe4" stroke="#bd7652"/>
    <text x="475" y="706" text-anchor="middle" class="heading">Evidence &amp; design findings</text>
    <text x="475" y="730" text-anchor="middle" class="body">Results · margins · open issues</text>
  </g>

  <text x="940" y="480" transform="rotate(-90 940 480)" text-anchor="middle" class="body" fill="#9b5b28">Refine requirements and design</text>
</svg>
